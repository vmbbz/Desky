    <path d="M160 329h194v67H160Z" fill="#BCEFF1"/>
    <path d="M312 329h42v67l-42-26Z" fill="#A7D6DF"/>
    <circle cx="217" cy="274" r="13" fill="#0A0E17"/>
    <circle cx="290" cy="274" r="13" fill="#0A0E17"/>
    <path d="M232 296c14 13 30 13 44 0" fill="none" stroke="#0A0E17" stroke-width="12" stroke-linecap="round"/>
  </g>
  <rect x="52" y="376" width="408" height="62" rx="31" fill="#75E6D7"/>
