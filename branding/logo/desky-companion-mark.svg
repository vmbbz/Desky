<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Deskiii companion mark</title>
  <desc id="desc">Milk peeks across the lower edge of a desktop window.</desc>
  <defs>
    <linearGradient id="background" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#16243A"/>
      <stop offset="1" stop-color="#080B13"/>
    </linearGradient>
    <filter id="panel-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity=".28"/>
    </filter>
    <filter id="mascot-shadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#0A0E17" flood-opacity=".2"/>
    </filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#background)"/>
  <rect x="70" y="70" width="372" height="350" rx="64" fill="#F8FAFC" filter="url(#panel-shadow)"/>
  <circle cx="110" cy="109" r="9" fill="#75E6D7"/>
  <circle cx="139" cy="109" r="9" fill="#BCEFF1"/>
  <circle cx="168" cy="109" r="9" fill="#78B7E2"/>
