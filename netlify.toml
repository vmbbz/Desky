[build]
  command = "npm ci --prefix services/commerce-hosted && npm run build --prefix services/commerce-hosted"
  publish = "services/commerce-hosted/dist/site"
  functions = "services/commerce-hosted/netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NPM_VERSION = "11"

[[redirects]]
  from = "/checkout/*"
  to = "/checkout.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy/index.html"
  status = 200

[[redirects]]
  from = "/support"
  to = "/support/index.html"
  status = 200

[[redirects]]
  from = "/security"
  to = "/security/index.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms/index.html"
  status = 200

[[redirects]]
  from = "/licenses"
  to = "/licenses/index.html"
  status = 200

[[redirects]]
  from = "/report-ai-content"
  to = "/report-ai-content/index.html"
  status = 200

[[redirects]]
  from = "/account/delete"
  to = "/account/delete/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-store"
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; manifest-src 'none'; worker-src 'none'; upgrade-insecure-requests"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
